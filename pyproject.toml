[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-rule-sentinel"
version = "0.2.0.dev0"
description = "Review-first, privacy-conscious sync for AI coding agent project instructions"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Agent Rule Sentinel contributors"}]
keywords = ["codex", "claude", "agent", "instructions", "developer-tools"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]

[project.scripts]
agent-rule-sentinel = "agent_rule_sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/SSK0188/agent-rule-sentinel"
Issues = "https://github.com/SSK0188/agent-rule-sentinel/issues"
Changelog = "https://github.com/SSK0188/agent-rule-sentinel/blob/main/CHANGELOG.md"
